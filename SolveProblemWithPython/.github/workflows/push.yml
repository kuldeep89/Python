name: Validate Python notebooks

on:
  push:
    paths:
      - 'SolveProblemWithPython/**'
      - 'SolveProblemWithPython/.github/workflows/push.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Python files
        run: python -m compileall -q SolveProblemWithPython

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for notebook in Path('SolveProblemWithPython').rglob('*.ipynb'):
              with notebook.open(encoding='utf-8') as file:
                  json.load(file)
              print(f'Validated {notebook}')
          PY